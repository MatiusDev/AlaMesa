name: Production Pipeline
on:
  push:
    branches: [production]

jobs:
  build-production:
    name: Build Production Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production images
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/alamesa-backend:production
            ghcr.io/${{ github.repository }}/alamesa-backend:latest
            ghcr.io/${{ github.repository }}/alamesa-backend:${{ github.sha }}

      - name: Build and push frontend production
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/alamesa-frontend:production
            ghcr.io/${{ github.repository }}/alamesa-frontend:latest
            ghcr.io/${{ github.repository }}/alamesa-frontend:${{ github.sha }}

  deploy-production:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-production
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Iniciando despliegue en producción..."
            
            # Login al registry
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            
            # Pull de las imágenes más recientes
            docker pull ghcr.io/${{ github.repository }}/alamesa-backend:production
            docker pull ghcr.io/${{ github.repository }}/alamesa-frontend:production
            
            # Parar y remover contenedores existentes
            docker stop alamesa-backend alamesa-frontend || true
            docker rm alamesa-backend alamesa-frontend || true
            
            # Crear red si no existe
            docker network create alamesa-network || true
            
            # Crear volúmenes para persistencia
            docker volume create alamesa-postgres-data || true
            docker volume create alamesa-mongodb-data || true
            
            # Ejecutar backend
            docker run -d --name alamesa-backend \
              --network alamesa-network \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e POSTGRES_HOST="${{ secrets.POSTGRES_HOST }}" \
              -e POSTGRES_DB="${{ secrets.POSTGRES_DB }}" \
              -e POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
              -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -p 8000:8000 \
              ghcr.io/${{ github.repository }}/alamesa-backend:production
            
            # Ejecutar frontend
            docker run -d --name alamesa-frontend \
              --network alamesa-network \
              -p 80:80 \
              ghcr.io/${{ github.repository }}/alamesa-frontend:production
            
            # Limpiar imágenes no utilizadas
            docker image prune -f
            
            echo "✅ Despliegue completado exitosamente!"
